name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install headers for the MIDI and HID extras
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libudev-dev libusb-1.0-0-dev
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check openhal tests
      - run: uv run ruff format --check openhal tests
      - run: uv run mypy openhal
      - run: uv run pytest -q

  dist:
    name: build the wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv build
      - id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    name: ${{ matrix.package }} on ${{ matrix.os }} with Python ${{ matrix.python }}
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        package: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install the ${{ matrix.package }} in a fresh venv and run openhal --version, openhal demo and halkit --version
        shell: bash
        run: |
          if [ "${{ matrix.package }}" = wheel ]; then file="dist/halkit-$VERSION-py3-none-any.whl"; else file="dist/halkit-$VERSION.tar.gz"; fi
          venv="$RUNNER_TEMP/venv"
          uv venv --python "${{ matrix.python }}" "$venv"
          uv pip install --python "$venv" "$file"
          bin="$venv/bin"
          if [ "$RUNNER_OS" = Windows ]; then bin="$venv/Scripts"; fi
          for command in openhal halkit; do
            printed=$("$bin/$command" --version)
            if [ "$printed" != "openhal $VERSION" ]; then
              echo "::error::$command --version printed \"$printed\", not \"openhal $VERSION\"."
              exit 1
            fi
          done
          "$bin/openhal" demo | tee demo.txt
          grep -q "6 requests, 1 blocked, 1 confirmed by a person." demo.txt

  installers:
    name: installers on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENHAL_SOURCE: git+https://github.com/${{ github.repository }}@${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run install.sh in a clean home from this commit's git source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clean="$RUNNER_TEMP/clean/home"
          mkdir -p "$clean"
          path=""
          IFS=:
          for folder in $PATH; do
            [ -x "$folder/uv" ] || path="${path:+$path:}$folder"
          done
          unset IFS
          env -i HOME="$clean" PATH="$path" OPENHAL_SOURCE="$OPENHAL_SOURCE" sh website/public/install.sh
          test -x "$clean/.local/bin/uv"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          printed=$("$clean/.local/bin/openhal" --version)
          echo "$printed"
          if [ "$printed" != "openhal $version" ]; then
            echo "::error::openhal --version printed \"$printed\", not \"openhal $version\"."
            exit 1
          fi
      - name: Run install.ps1 in a clean home from this commit's git source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\website\public\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw "install.ps1 does not parse. $errors" }
          $clean = Join-Path $env:RUNNER_TEMP 'clean\home'
          New-Item -ItemType Directory -Force $clean | Out-Null
          $env:HOME = $clean
          $env:USERPROFILE = $clean
          $env:LOCALAPPDATA = Join-Path $clean 'AppData\Local'
          $env:APPDATA = Join-Path $clean 'AppData\Roaming'
          $env:UV_INSTALL_DIR = Join-Path $clean '.local\bin'
          $env:UV_TOOL_BIN_DIR = $env:UV_INSTALL_DIR
          $env:UV_TOOL_DIR = Join-Path $clean '.local\share\uv\tools'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $clean '.local\share\uv\python'
          $env:UV_CACHE_DIR = Join-Path $clean '.cache\uv'
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          Get-Content -Raw website/public/install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 stopped with an error.' }
          if (-not (Test-Path (Join-Path $env:UV_INSTALL_DIR 'uv.exe'))) { throw 'install.ps1 did not put uv in place.' }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $printed = (& (Join-Path $env:UV_TOOL_BIN_DIR 'openhal.exe') --version | Out-String).Trim()
          Write-Host $printed
          if ($printed -ne "openhal $version") { throw "openhal --version printed `"$printed`", not `"openhal $version`"." }
