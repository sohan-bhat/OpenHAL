name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the social images and icons
        run: pnpm exec playwright install --with-deps chromium
      - name: Build for https://sohan-bhat.github.io/OpenHAL/
        run: pnpm exec astro build
        env:
          OPENHAL_SITE: https://sohan-bhat.github.io
      - run: node scripts/check-links.mjs dist
      - run: node scripts/rebase.mjs dist /OpenHAL https://sohan-bhat.github.io
      - name: Build the search index for the rebased site
        run: node scripts/search-index.mjs dist /OpenHAL
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
