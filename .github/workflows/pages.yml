name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the social images and icons
        run: pnpm exec playwright install --with-deps chromium
      - name: Build for https://sohan-bhat.github.io/OpenHAL/
        run: pnpm exec astro build
        env:
          OPENHAL_SITE: https://sohan-bhat.github.io
      - run: node scripts/check-links.mjs dist
      - run: node scripts/rebase.mjs dist /OpenHAL https://sohan-bhat.github.io
      - name: Build the search index for the rebased site
        run: node scripts/search-index.mjs dist /OpenHAL
      - name: Stamp the build with its commit
        run: printf '{"commit":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait until the live site serves this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 40); do
            live=$(curl -fsS "${PAGE_URL%/}/version.json?run=$GITHUB_RUN_ID-$attempt" | jq -r .commit || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "The live site serves $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $attempt found ${live:-no version.json}, waiting for $GITHUB_SHA."
            sleep 15
          done
          echo "The live site still doesn't serve $GITHUB_SHA after 10 minutes."
          exit 1
