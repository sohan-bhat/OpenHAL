[project]
name = "openhal-hub"
version = "0.1.0.dev0"
description = "An open-source protocol for AI agents to control hardware."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "OpenHAL contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pydantic>=2.9",
  "pint>=0.24",
  "pyyaml>=6.0.2",
  "typer>=0.15",
  "rich>=13.9",
  "regex>=2024.11",
  "httpx>=0.28",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=13",
  "mcp>=2.3",
  "zeroconf>=0.136",
]

[project.optional-dependencies]
# The hub's packages are core dependencies now. The extra stays so older install commands keep working.
hub = []
serial = ["pyserial>=3.5"]
firmata = ["pyserial>=3.5"]
marlin = ["pyserial>=3.5"]
scpi = ["pyvisa>=1.16", "pyvisa-py>=0.8", "pyusb>=1.3", "pyserial>=3.5"]
moonraker = ["httpx>=0.28", "websockets>=13"]
octoprint = ["httpx>=0.28"]
homeassistant = ["httpx>=0.28", "websockets>=13"]
esphome = ["aioesphomeapi>=46"]
openhal-firmware = ["pyserial>=3.5"]
rpi-gpio = ["gpiozero>=2.0.1"]
rpi-camera = []
mqtt = ["paho-mqtt>=2.1.0"]
modbus = ["pymodbus[serial]>=3.16.1"]
ble = ["bleak>=3.0.2"]
midi = ["mido>=1.3.3", "python-rtmidi>=1.5.8"]
hid = ["hidapi>=0.15.0"]
uvc = ["opencv-python-headless>=5.0.0.93"]
http = ["httpx>=0.28.1"]
onvif = ["httpx>=0.28.1", "defusedxml>=0.7.1"]
bambu = ["paho-mqtt>=2.1.0"]
can = ["python-can>=4.6.1"]
knx = ["xknx>=4.0.0"]
matter = ["websockets>=13"]
pi-i2c-spi = ["smbus2>=0.6.1", "spidev>=3.8; sys_platform == 'linux'"]
upnp = ["async-upnp-client>=0.49.0"]
zigbee-zwave = ["paho-mqtt>=2.1.0", "websockets>=13"]
grbl = ["pyserial>=3.5"]
ros2 = ["websockets>=13"]
opcua = ["asyncua>=2.1.0"]
sila2 = ["sila2>=0.14.0"]
alpaca = ["httpx>=0.28.1"]
pylabrobot = ["pylabrobot>=0.2.2"]

[project.scripts]
openhal = "openhal.cli.main:app"
openhald = "openhal.hub.daemon:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "types-pyserial>=3.5",
  "pyvisa-sim>=0.7",
  "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhal"]

[tool.hatch.build.targets.wheel.force-include]
"examples/plant-waterer" = "openhal/examples/plant-waterer"
"examples/print-babysitter" = "openhal/examples/print-babysitter"
"library" = "openhal/library_data"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "ASYNC", "BLE", "SLF", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "SLF001"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openhal.kernel.*", "openhal.spec.*", "openhal.audit.*", "openhal.drivers.base", "openhal._brand"]
strict = true

[[tool.mypy.overrides]]
module = ["regex"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
