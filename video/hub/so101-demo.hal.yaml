device: { name: SO-101 arm (simulated), model: SO-101, manufacturer: The Robot Studio }
id: arm
connect: { mujoco: OPENHAL_SO101_SCENE, keyframe: ready, action_wait: 8 s, tolerance: 1 mm, aim_tolerance: 2 deg }
read:
  shoulder_pan: { unit: deg, every: 500 ms }
  shoulder_lift: { unit: deg, every: 500 ms }
  elbow_flex: { unit: deg, every: 500 ms }
  wrist_flex: { unit: deg, every: 500 ms }
  wrist_roll: { unit: deg, every: 500 ms }
  gripper: { unit: percent, every: 500 ms }
  cube_x: { unit: mm, every: 500 ms, map: { body: cube, axis: x } }
  cube_y: { unit: mm, every: 500 ms, map: { body: cube, axis: y } }
  cube_z: { unit: mm, every: 500 ms, map: { body: cube, axis: z } }
write:
  shoulder_pan_goal: { unit: deg, min: -100, max: 100, max_change_per_s: 60 }
  shoulder_lift_goal: { unit: deg, min: -98, max: 98, max_change_per_s: 60 }
  elbow_flex_goal: { unit: deg, min: -95, max: 95, max_change_per_s: 60 }
  wrist_flex_goal: { unit: deg, min: -93, max: 93, max_change_per_s: 90 }
  wrist_roll_goal: { unit: deg, min: -155, max: 160, max_change_per_s: 90 }
  gripper_goal: { unit: percent, min: 0, max: 100, max_change_per_s: 100 }
actions:
  move_to:
    description: >-
      Move the gripper tip to a point with the gripper pointing down, every joint at most at speed.
      x, y and z are in the arm's base frame.
    args:
      x: { unit: mm, min: 160, max: 220 }
      y: { unit: mm, min: -100, max: 100 }
      z: { unit: mm, min: 10, max: 70 }
      speed: { unit: deg/s, min: 5, max: 60 }
    map:
      command: move_to
      site: gripperframe
      aim: { axis: [1, 0, 0], toward: [0, 0, -1] }
      joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex]
      speed: speed
    effects: [shoulder_pan_goal, shoulder_lift_goal, elbow_flex_goal, wrist_flex_goal]
  drop_in_bin:
    description: Carry the part in the gripper over the bin and open the gripper. A dropped part can't be put back.
    confirm: confirm-each-time
    map:
      command: move_to
      site: gripperframe
      at: { x: 120 mm, y: -170 mm, z: 65 mm }
      aim: { axis: [1, 0, 0], toward: [0, 0, -1] }
      joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex]
      then: { gripper_goal: 60 }
    effects: [shoulder_pan_goal, shoulder_lift_goal, elbow_flex_goal, wrist_flex_goal, gripper_goal]
  hold:
    description: Hold every joint where it is now.
safe_state: { action: hold }
watchdog: { heartbeat: 1 s, on_loss: safe_state }
hazard: medium
notes: >-
  A simulated SO-101 in MuJoCo, built from the MuJoCo Menagerie model, on a desk with a red 25 mm cube and a bin.
  The cube starts inside the workspace box of move_to. The bin stands outside that box, centred at x 120 mm and
  y -170 mm, so only drop_in_bin reaches the bin.
  Joints are in degrees and the gripper in percent open, as on the real arm with LeRobot.
  The speed of move_to is the peak speed of every joint during the move, and 60 deg/s is the most the file allows.
  A stop holds every joint where it stands and keeps the grip.
  The file is medium hazard because a simulation can't hurt anyone. The real arm's file is high hazard.
provenance: { source: hand-written, by: openhal demo recording, at: 2026-11-03 }
