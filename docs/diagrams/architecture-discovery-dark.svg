<svg xmlns="http://www.w3.org/2000/svg" width="747" height="1058" aria-labelledby="oh-title oh-desc" data-d2-version="v0.9.0" preserveAspectRatio="xMinYMin meet" role="img" viewBox="0 0 747 1058"><title id="oh-title">Device discovery</title><desc id="oh-desc">openhal discover looks for devices over USB, mDNS, VISA, BLE, ecosystem APIs and Raspberry Pi checks, identifies each with read-only commands, and asks the library matcher. A match offers a library file that loads read-only. A known protocol builds a draft file. An unknown device is listed and offered the driver writer.</desc><svg width="747" height="1058" class="d2-3188604548 d2-svg" viewBox="-1 -1 747 1058"><style type="text/css"><![CDATA[
