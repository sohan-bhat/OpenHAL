<svg xmlns="http://www.w3.org/2000/svg" width="308" height="992" aria-labelledby="oh-title oh-desc" data-d2-version="v0.9.0" preserveAspectRatio="xMinYMin meet" role="img" viewBox="0 0 308 992"><title id="oh-title">Stop</title><desc id="oh-desc">A stop from any client sets the kernel&apos;s global lock first, cancels pending confirmations and pauses every routine, applies each device&apos;s safe state, reports per device, and blocks commands until a person unlocks.</desc><svg width="308" height="992" class="d2-1264677475 d2-svg" viewBox="-1 -1 308 992"><style type="text/css"><![CDATA[
.d2-1264677475 .text {
	font-family: "d2-1264677475-font-regular";
}
@font-face {
	font-family: d2-1264677475-font-regular;
	src: url("data:application/font-woff;base64,");
}.shape {
  shape-rendering: geometricPrecision;
  stroke-linejoin: round;
}
.connection {
  stroke-linecap: round;
  stroke-linejoin: round;
}
.blend {
  mix-blend-mode: multiply;
  opacity: 0.5;
}

		.d2-1264677475 .fill-N7{fill:#FFFFFF;}
		.d2-1264677475 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3RvcA== box"><rect width="282" height="78" x="12" y="12" fill="#15181d" stroke="#5a626d" class="shape" rx="6" style="stroke-width:1.5"/><text x="153" y="48.5" fill="#e7eaee" class="text" style="text-anchor:middle;font-size:14px"><tspan x="153" dy="0">stop_all from the CLI, MCP,</tspan><tspan x="153" dy="16.5">dashboard, library or a GPIO button</tspan></text></g><g class="bG9jaw== box"><rect width="173" height="78" x="66" y="160" fill="#15181d" stroke="#5a626d" class="shape" rx="6" style="stroke-width:1.5"/><text x="152.5" y="196.5" fill="#e7eaee" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152.5" dy="0">The kernel sets the</tspan><tspan x="152.5" dy="16.5">global lock first</tspan></text></g><g class="Y2FuY2Vs box"><rect width="246" height="78" x="30" y="308" fill="#15181d" stroke="#5a626d" class="shape" rx="6" style="stroke-width:1.5"/><text x="153" y="344.5" fill="#e7eaee" class="text" style="text-anchor:middle;font-size:14px"><tspan x="153" dy="0">Cancel pending confirmations,</tspan><tspan x="153" dy="16.5">pause every routine</tspan></text></g><g class="c2FmZQ== box"><rect width="246" height="78" x="30" y="456" fill="#15181d" stroke="#5a626d" class="shape" rx="6" style="stroke-width:1.5"/><text x="153" y="492.5" fill="#e7eaee" class="text" style="text-anchor:middle;font-size:14px"><tspan x="153" dy="0">Apply each device&apos;s safe state</tspan><tspan x="153" dy="16.5">with kernel-internal grants</tspan></text></g><g class="cmVwb3J0 box"><rect width="203" height="78" x="51" y="604" fill="#15181d" stroke="#5a626d" class="shape" rx="6" style="stroke-width:1.5"/><text x="152.5" y="640.5" fill="#e7eaee" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152.5" dy="0">Report per device: safe,</tspan><tspan x="152.5" dy="16.5">failed or no safe state</tspan></text></g><g class="bG9ja2Vk box"><rect width="210" height="78" x="48" y="752" fill="#2a1614" stroke="#d57a72" class="shape" rx="6" style="stroke-width:1.5"/><text x="153" y="788.5" fill="#d57a72" class="text" style="text-anchor:middle;font-size:14px"><tspan x="153" dy="0">Commands blocked until</tspan><tspan x="153" dy="16.5">a person unlocks</tspan></text></g><g class="dW5sb2Nr box"><rect width="266" height="78" x="20" y="900" fill="#15181d" stroke="#5a626d" class="shape" rx="6" style="stroke-width:1.5"/><text x="153" y="936.5" fill="#e7eaee" class="text" style="text-anchor:middle;font-size:14px"><tspan x="153" dy="0">openhal unlock or the dashboard,</tspan><tspan x="153" dy="16.5">human token and typed phrase</tspan></text></g><g class="KHN0b3AgLSZndDsgbG9jaylbMF0= msg"><marker id="mk-d2-1264677475-3475696764" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path fill="#a0a7b1" stroke-width="1.5" d="M0 0 10 6 0 12z" class="connection"/></marker><path fill="none" stroke="#a0a7b1" marker-end="url(#mk-d2-1264677475-3475696764)" d="M 153 92 L 153 156" class="connection" mask="url(#d2-1264677475)" style="stroke-width:1.5"/></g><g class="KGxvY2sgLSZndDsgY2FuY2VsKVswXQ== msg"><path fill="none" stroke="#a0a7b1" marker-end="url(#mk-d2-1264677475-3475696764)" d="M 153 240 L 153 304" class="connection" mask="url(#d2-1264677475)" style="stroke-width:1.5"/></g><g class="KGNhbmNlbCAtJmd0OyBzYWZlKVswXQ== msg"><path fill="none" stroke="#a0a7b1" marker-end="url(#mk-d2-1264677475-3475696764)" d="M 153 388 L 153 452" class="connection" mask="url(#d2-1264677475)" style="stroke-width:1.5"/></g><g clas