<svg xmlns="http://www.w3.org/2000/svg" width="307" height="992" aria-labelledby="oh-title oh-desc" data-d2-version="v0.9.0" preserveAspectRatio="xMinYMin meet" role="img" viewBox="0 0 307 992"><title id="oh-title">Stop</title><desc id="oh-desc">A stop from any client sets the kernel&apos;s global lock first, cancels pending confirmations and pauses every routine, applies each device&apos;s safe state, reports per device, and blocks commands until a person unlocks.</desc><svg width="307" height="992" class="d2-4102145623 d2-svg" viewBox="-1 -1 307 992"><style type="text/css"><![CDATA[
