  stroke-linecap: round;
  stroke-linejoin: round;
}
.blend {
  mix-blend-mode: multiply;
  opacity: 0.5;
}

		.d2-4102145623 .fill-N7{fill:#FFFFFF;}
		.d2-4102145623 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3RvcA== box"><rect width="281" height="78" x="12" y="12" fill="#212220" stroke="#687066" class="shape" rx="6" style="stroke-width:1.5"/><text x="152.5" y="48.5" fill="#eceeec" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152.5" dy="0">stop_all from the CLI, MCP,</tspan><tspan x="152.5" dy="16.5">dashboard, library or a GPIO button</tspan></text></g><g class="bG9jaw== box"><rect width="171" height="78" x="67" y="160" fill="#212220" stroke="#687066" class="shape" rx="6" style="stroke-width:1.5"/><text x="152.5" y="196.5" fill="#eceeec" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152.5" dy="0">The kernel sets the</tspan><tspan x="152.5" dy="16.5">global lock first</tspan></text></g><g class="Y2FuY2Vs box"><rect width="245" height="78" x="30" y="308" fill="#212220" stroke="#687066" class="shape" rx="6" style="stroke-width:1.5"/><text x="152.5" y="344.5" fill="#eceeec" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152.5" dy="0">Cancel pending confirmations,</tspan><tspan x="152.5" dy="16.5">pause every routine</tspan></text></g><g class="c2FmZQ== box"><rect width="244" height="78" x="30" y="456" fill="#212220" stroke="#687066" class="shape" rx="6" style="stroke-width:1.5"/><text x="152" y="492.5" fill="#eceeec" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152" dy="0">Apply each device&apos;s safe state</tspan><tspan x="152" dy="16.5">with kernel-internal grants</tspan></text></g><g class="cmVwb3J0 box"><rect width="202" height="78" x="51" y="604" fill="#212220" stroke="#687066" class="shape" rx="6" style="stroke-width:1.5"/><text x="152" y="640.5" fill="#eceeec" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152" dy="0">Report per device: safe,</tspan><tspan x="152" dy="16.5">failed or no safe state</tspan></text></g><g class="bG9ja2Vk box"><rect width="208" height="78" x="48" y="752" fill="#391714" stroke="#d57a72" class="shape" rx="6" style="stroke-width:1.5"/><text x="152" y="788.5" fill="#d57a72" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152" dy="0">Commands blocked until</tspan><tspan x="152" dy="16.5">a person unlocks</tspan></text></g><g class="dW5sb2Nr box"><rect width="266" height="78" x="19" y="900" fill="#212220" stroke="#687066" class="shape" rx="6" style="stroke-width:1.5"/><text x="152" y="936.5" fill="#eceeec" class="text" style="text-anchor:middle;font-size:14px"><tspan x="152" dy="0">openhal unlock or the dashboard,</tspan><tspan x="152" dy="16.5">human token and typed phrase</tspan></text></g><g class="KHN0b3AgLSZndDsgbG9jaylbMF0= msg"><marker id="mk-d2-4102145623-1516801945" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="7" refY="6" viewBox="0 0 10 12"><path fill="#afb5ad" stroke-width="1.5" d="M0 0 10 6 0 12z" class="connection"/></marker><path fill="none" stroke="#afb5ad" marker-end="url(#mk-d2-4102145623-1516801945)" d="M 152.5 92 L 152.5 156" class="connection" mask="url(#d2-4102145623)" style="stroke-width:1.5"/></g><g class="KGxvY2sgLSZndDsgY2FuY2VsKVswXQ== msg"><path fill="none" stroke="#afb5ad" marker-end="url(#mk-d2-4102145623-1516801945)" d="M 152.5 240 L 152.5 304" class="connection" mask="url(#d2-4102145623)" style="stroke-width:1.5"/></g><g class="KGNhbmNlbCAtJmd0OyBzYWZlKVswXQ== msg"><path fill="none" stroke="#afb5ad" marker-end="url(#mk-d2-4102145623-1516801945)" d="M 152.5 388 L 152.5 452" class="connection" mask="url(#d2-4102145623)" style="stroke-width