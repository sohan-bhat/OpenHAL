openhal: "0.1"
device: Arduino plant waterer
id: plant-waterer
match:
  firmware: { product: plant-waterer }
connect: { openhal-firmware: "sim:plant-waterer" }
read:
  soil_moisture: { unit: "%", every: 1 s, range: [0, 100] }
  tank: { type: enum, values: [empty, ok], every: 1 s }
actions:
  water:
    description: Run the pump for a number of seconds.
    args:
      duration: { unit: s, min: 1, max: 30 }
    require:
      - condition: "tank == ok"
        message: "pump can't run while tank is empty"
    max_runs: { count: 3, per: 1 h }
  stop:
    description: Turn the pump off now.
safe_state: { action: stop }
watchdog: { heartbeat: 1 s, on_loss: safe_state }
hazard: low
notes: "A simulated board that implements the real firmware protocol and runs the same logic as plant-waterer.ino. Nothing here touches hardware."
provenance:
  source: sketch
  from: examples/plant-waterer/plant-waterer.ino
  verification: { status: unverified }
confirmed: { by: owner, at: 2026-10-24, sha256: 04505be094b281d522aed6e739d8a8c73012adc37e9c22954eb342e49a510396 }
