openhal: "0.1"
device: Printer camera
id: printer-cam
connect: { http: "http://printer.local", timeout: 5 s }
read:
  frame: { type: image, map: { path: /webcam/, query: { action: snapshot } } }
hazard: low
notes: "A USB camera on the printer's host, pointed at the bed. crowsnest serves its snapshots over HTTP. Read-only."
