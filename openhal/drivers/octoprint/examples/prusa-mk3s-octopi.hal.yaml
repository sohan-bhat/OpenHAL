# A Prusa i3 MK3S run through OctoPrint on a Raspberry Pi (OctoPi).
# The API key lives in the OCTOPRINT_API_KEY environment variable, never in this file.
# The limits stay unconfirmed until a human reviews them, so the file loads read-only.
device: { name: Prusa MK3S, model: Original Prusa i3 MK3S, manufacturer: Prusa Research }
id: mk3s
connect: { octoprint: octopi.local, port: 80, token_env: OCTOPRINT_API_KEY, timeout: 5 s }
read:
  state: { type: enum, values: [standby, printing, paused, cancelling, error, offline], every: 2 s }
  extruder_temp: { unit: degC, every: 2 s, range: [0, 300] }
  bed_temp: { unit: degC, every: 2 s, range: [0, 120] }
  progress: { unit: percent, every: 10 s }
write:
  extruder_target: { unit: degC, min: 0, max: 260, max_change_per_s: 50, confirm: confirm }
  bed_target: { unit: degC, min: 0, max: 100, max_change_per_s: 20 }
  fan_speed: { unit: percent, min: 0, max: 100 }
actions:
  home:
    args:
      axes: { type: enum, values: [x, y, z, xy, all] }
    require: ["state != printing"]
    confirm: confirm
  pause: { require: ["state == printing"] }
  resume: { require: ["state == paused"] }
  cancel: { confirm: confirm }
safe_state:
  - { extruder_target: 0, bed_target: 0, fan_speed: 0 }
interlocks:
  - if: "extruder_target > 0 degC"
    require: "state != offline"
    message: "Connect the printer in OctoPrint before heating."
watchdog:
  heartbeat: 5 s
  on_loss: hold
hazard: medium
provenance: { source: hand-written, by: openhal octoprint driver example, at: 2026-10-24 }
