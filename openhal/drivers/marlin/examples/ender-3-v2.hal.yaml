# A Creality Ender-3 V2 on stock Marlin 2.x, connected over USB.
# The limits stay unconfirmed until a human reviews them, so the file loads read-only.
device: { name: Ender-3 V2, model: Ender-3 V2, manufacturer: Creality }
id: ender
match:
  usb: ["1a86:7523"]
connect:
  marlin: auto
  baud: 115200
  timeout: 5 s
  settle: 2 s
  autoreport: 2 s
read:
  extruder_temp: { unit: degC, every: 2 s, range: [0, 300] }
  bed_temp: { unit: degC, every: 2 s, range: [0, 120] }
  position_z: { unit: mm }
  sd_printing: { type: bool, every: 5 s }
  sd_progress: { unit: percent, every: 5 s }
write:
  extruder_target: { unit: degC, min: 0, max: 240, max_change_per_s: 50, confirm: confirm }
  bed_target: { unit: degC, min: 0, max: 90, max_change_per_s: 20 }
  fan_speed: { unit: percent, min: 0, max: 100, step: 1 }
actions:
  home:
    description: Home the axes with G28.
    args:
      axes: { type: enum, values: [x, y, z, xy, all] }
    require: ["sd_printing == false"]
    confirm: confirm
  pause: { description: Pause a print from the SD card (M25). }
  resume: { description: Resume a paused SD card print (M24). }
  cancel: { description: "Abort the SD card print (M524).", confirm: confirm }
safe_state:
  - { extruder_target: 0, bed_target: 0, fan_speed: 0 }
interlocks:
  - if: "extruder_target > 0 degC"
    require: "extruder_temp < 280 degC"
    message: "The hotend reads above 280 degC. Check the thermistor before heating."
watchdog:
  heartbeat: 5 s
  on_loss: safe_state
hazard: medium
notes: "Stock Ender-3 V2 firmware. The bed is 220 by 220 mm and Z homes to the bed."
provenance: { source: hand-written, by: openhal marlin driver example, at: 2026-10-24 }
