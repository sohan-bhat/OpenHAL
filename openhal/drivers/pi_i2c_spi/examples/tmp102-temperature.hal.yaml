device: { name: Enclosure temperature, manufacturer: Texas Instruments, model: TMP102 }
id: enclosure-tmp102
connect: { pi-i2c-spi: i2c-1, address: 0x48, timeout: 500 ms }
read:
  temperature:
    unit: degC
    every: 2 s
    range: [-40, 125]
    map: { register: 0x00, length: 2, signed: true, bit: 4, bits: 12, scale: 0.0625 }
write:
  alert_high:
    unit: degC
    min: 30
    max: 85
    map:
      register: 0x03
      length: 2
      signed: true
      bit: 4
      bits: 12
      scale: 0.0625
      state: { register: 0x03, length: 2, signed: true, bit: 4, bits: 12, scale: 0.0625 }
  alert_low:
    unit: degC
    min: 25
    max: 80
    map:
      register: 0x02
      length: 2
      signed: true
      bit: 4
      bits: 12
      scale: 0.0625
      state: { register: 0x02, length: 2, signed: true, bit: 4, bits: 12, scale: 0.0625 }
  shutdown:
    type: bool
    map: { register: 0x01, length: 2, bit: 8, bits: 1, preserve: true, state: { register: 0x01, length: 2, bit: 8, bits: 1 } }
interlocks:
  - if: "alert_low > 0 degC"
    require: "alert_low < alert_high"
    message: "T_LOW must stay below T_HIGH or the alert pin never clears."
hazard: low
notes: >-
  A TMP102 breakout on the Pi's I2C bus 1 (pins 3 and 5) with ADD0 tied to ground, so its address is
  0x48. Registers come from the TI TMP102 datasheet (SBOS397). The ALERT pin follows T_HIGH and T_LOW,
  which this file sets. Shutdown stops conversions, and the temperature register then keeps its last value.
safe_state_note: A sensor with no outputs. The alert thresholds stay as they were when the hub stops.
provenance: { source: hand-written, by: openhal pi-i2c-spi driver example, at: 2026-10-24, from: "https://www.ti.com/lit/ds/symlink/tmp102.pdf" }
